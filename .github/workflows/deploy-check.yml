name: Deploy Gate

on:
  push:
    branches: [main]

jobs:
  gate:
    name: All checks must pass before deploy
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Check no TODO/FIXME in critical paths
        run: |
          # Warn (not fail) on leftover TODOs in payment and auth code
          grep -rn "TODO\|FIXME\|HACK\|XXX" \
            food-delivery-backend/src/modules/payment \
            food-delivery-backend/src/modules/auth \
            food-delivery-backend/src/middlewares/auth.middleware.js \
            || true

      - name: Verify migration lock file is present
        run: test -f food-delivery-backend/prisma/migrations/migration_lock.toml

      - name: Check for hardcoded secrets
        run: |
          # Fail if any file in src/ contains what looks like a hardcoded JWT or API key
          if grep -rn "eyJhbGciOiJIUzI1NiJ9\|sk_live\|sk_test_" \
               food-delivery-backend/src/ ghost-kitchen-frontend/; then
            echo "::error::Possible hardcoded secret detected"
            exit 1
          fi
          echo "No hardcoded secrets found"
