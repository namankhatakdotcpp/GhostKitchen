name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "food-delivery-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "food-delivery-backend/**"

defaults:
  run:
    working-directory: food-delivery-backend

# Env vars needed by postinstall (prisma generate + resolve-failed-migrations.js).
# resolve-failed-migrations.js gracefully exits-0 when the DB is unreachable,
# so a placeholder URL is sufficient and nothing actually connects.
env:
  DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
  JWT_SECRET: "test-secret-32-chars-minimum-here"
  JWT_REFRESH_SECRET: "test-refresh-secret-32-chars-min"
  CASHFREE_APP_ID: "test"
  CASHFREE_SECRET_KEY: "test"
  CASHFREE_ENV: "sandbox"
  FRONTEND_URL: "http://localhost:3000"
  BACKEND_URL: "http://localhost:5000"
  ALLOWED_ORIGINS: "http://localhost:3000"

jobs:
  validate:
    name: Lint & Schema
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: food-delivery-backend/package-lock.json

      - name: Upgrade npm to match lockfile generator
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migration drift
        run: npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow" || true
        continue-on-error: true

      - name: Verify module imports (smoke test)
        run: node --input-type=module --eval "import('./src/config/env.js').catch(()=>{}); console.log('Import smoke test passed');"

  test:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: food-delivery-backend/package-lock.json

      - name: Upgrade npm to match lockfile generator
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: food-delivery-backend/package-lock.json

      - name: Upgrade npm to match lockfile generator
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
